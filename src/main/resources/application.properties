
# Nombre de la aplicacion
spring.application.name=backendpetsalud

# Conexion a MySQL

spring.datasource.url=jdbc:mysql://localhost:3306/petsalud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor
server.port=8080

# Clave JWT desde variable de entorno
jwt.secret=${JWT_SECRET}

logging.level.org.springframework.security=DEBUG